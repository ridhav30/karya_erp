    <script>
      // Apply the saved theme before first paint (no light→dark flash).
      (function () {
        try {
          var t = localStorage.getItem('karya_erp_theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
          if (localStorage.getItem('karya_erp_lang') === 'ar') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; }
        } catch (e) {}
      })();
    </script>
